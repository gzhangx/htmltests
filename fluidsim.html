<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fluid Sim</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#14161c;color:#c8c4b8;font-family:'Segoe UI',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:14px 10px 22px;user-select:none;
}
h1{color:#7eb6ff;letter-spacing:4px;font-size:1.38em}
#sub{color:#7a8494;font-size:.82em;margin:2px 0 8px}
#views{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;width:100%}
.view{display:flex;flex-direction:column;align-items:center}
.view h2{color:#9eb6d4;font-size:.95em;letter-spacing:1px;margin-bottom:4px}
.info{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:.82em;margin-bottom:6px}
.info strong{color:#7eb6ff}
canvas{
  border:2px solid #3a4250;border-radius:6px;display:block;max-width:100%;
  box-shadow:0 0 36px rgba(0,0,0,.45);background:#07090d;cursor:crosshair;
}
#hint{margin-top:8px;max-width:920px;text-align:center;color:#6a7380;font-size:.8em;line-height:1.45}
#hint b{color:#9eb0c8}
.btns{display:flex;gap:8px;margin-top:8px}
button{
  background:#242a34;color:#7eb6ff;border:1px solid #5a6470;
  padding:7px 16px;border-radius:6px;cursor:pointer;font-weight:700;font-size:.9em;
}
button:hover{background:#323a46}
</style>
</head>
<body>
<h1>FLUID SIM</h1>
<p id="sub">2D SPH from Fluid-Sim · Test A</p>
<div id="views"></div>
<p id="hint">
  <b>Left drag</b> pulls. <b>Right drag</b> pushes.
  <b>Space</b> pauses. <b>Right arrow</b> steps one frame. <b>R</b> resets.
</p>

<script>
'use strict';

const DEFAULTS = {
  width: 620,
  height: 360,
  gravity: -12,
  damping: 0.95,
  smoothing: 0.35,
  targetDensity: 55,
  pressure: 500,
  nearPressure: 5,
  viscosity: 0.03,
  bounds: { x: 17.1, y: 9.3 },
  obstacle: { x: 0, y: 0 },
  obstacleCentre: { x: 0, y: 0 },
  interactRadius: 2,
  interactStrength: 90,
  iterations: 3,
  maxDt: 1 / 60,
  predict: 1 / 120,
  velMax: 6.5,
  particleScale: 0.08,
  spawn: { x: 0, y: 0.66, w: 6.42, h: 4.39, density: 159, jitter: 0.03 },
  seed: 42,
  title: 'Fluid'
};

function spawnCount(w, h, density) {
  const target = Math.ceil(w * h * density);
  const len = w + h;
  const tx = w / len, ty = h / len;
  const m = Math.sqrt(target / (tx * ty));
  return { nx: Math.ceil(tx * m), ny: Math.ceil(ty * m) };
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildGradient() {
  const keys = [
    [0.062, 34, 87, 185],
    [0.507, 76, 255, 144],
    [0.713, 255, 237, 0],
    [1, 247, 73, 8]
  ];
  const cols = [];
  for (let i = 0; i < 32; i++) {
    const t = i / 31;
    let a = keys[0], b = keys[0];
    if (t >= keys[keys.length - 1][0]) a = b = keys[keys.length - 1];
    else for (let k = 0; k < keys.length - 1; k++) {
      if (t >= keys[k][0] && t <= keys[k + 1][0]) { a = keys[k]; b = keys[k + 1]; break; }
    }
    const u = a === b ? 0 : (t - a[0]) / (b[0] - a[0]);
    cols.push('rgb(' + ((a[1] + (b[1] - a[1]) * u) | 0) + ',' + ((a[2] + (b[2] - a[2]) * u) | 0) + ',' + ((a[3] + (b[3] - a[3]) * u) | 0) + ')');
  }
  return cols;
}

const GRAD = buildGradient();

class FluidSim {
  constructor(canvas, options) {
    const o = Object.assign({}, DEFAULTS, options || {});
    this.canvas = canvas;
    this.g = canvas.getContext('2d', { alpha: false });
    this.viewW = o.width;
    this.viewH = o.height;
    canvas.width = this.viewW;
    canvas.height = this.viewH;

    this.gravity = o.gravity;
    this.damping = o.damping;
    this.h = o.smoothing;
    this.h2 = this.h * this.h;
    this.targetDensity = o.targetDensity;
    this.pressureMul = o.pressure;
    this.nearPressureMul = o.nearPressure;
    this.viscosity = o.viscosity;
    this.bounds = o.bounds;
    this.obstacle = o.obstacle;
    this.obstacleCentre = o.obstacleCentre;
    this.interactRadius = o.interactRadius;
    this.interactStrength = o.interactStrength;
    this.iterations = o.iterations;
    this.maxDt = o.maxDt;
    this.predict = o.predict;
    this.velMax = o.velMax;
    this.particleScale = o.particleScale;
    this.spawn = o.spawn;
    this.seed = o.seed;
    this.title = o.title;

    const pi = Math.PI;
    this.poly6 = 4 / (pi * Math.pow(this.h, 8));
    this.spiky3 = 10 / (pi * Math.pow(this.h, 5));
    this.spiky2 = 6 / (pi * Math.pow(this.h, 4));
    this.dSpiky3 = 30 / (Math.pow(this.h, 5) * pi);
    this.dSpiky2 = 12 / (Math.pow(this.h, 4) * pi);
    this.selfD = this.h2 * this.spiky2;
    this.selfN = this.h * this.h2 * this.spiky3;

    this.ox = 48;
    this.oy = 36;
    this.gw = 96;
    this.gh = 72;
    this.halfX = this.bounds.x * 0.5;
    this.halfY = this.bounds.y * 0.5;
    this.obsHx = this.obstacle.x * 0.5;
    this.obsHy = this.obstacle.y * 0.5;
    this.scale = Math.min(this.viewW / (this.bounds.x * 1.08), this.viewH / (this.bounds.y * 1.12));

    const grid = spawnCount(this.spawn.w, this.spawn.h, this.spawn.density);
    this.gridN = grid;
    this.n = grid.nx * grid.ny;
    this.px = new Float32Array(this.n);
    this.py = new Float32Array(this.n);
    this.vx = new Float32Array(this.n);
    this.vy = new Float32Array(this.n);
    this.predX = new Float32Array(this.n);
    this.predY = new Float32Array(this.n);
    this.dens = new Float32Array(this.n);
    this.near = new Float32Array(this.n);
    this.homeX = new Float32Array(this.n);
    this.homeY = new Float32Array(this.n);
    this.next = new Int32Array(this.n);
    this.heads = new Int32Array(this.gw * this.gh);

    this.dt = this.maxDt / this.iterations;
    this.paused = false;
    this.stepOnce = false;
    this.mouse = { x: 0, y: 2, pull: false, push: false };
    this.last = performance.now();
    this.stepMs = 0;
    this.hud = null;

    this.placeSpawn();
    this.reset();
    this.bindPointer();
  }

  placeSpawn() {
    const rand = mulberry32(this.seed);
    const g = this.gridN;
    const s = this.spawn;
    let i = 0;
    for (let y = 0; y < g.ny; y++) {
      for (let x = 0; x < g.nx; x++) {
        const tx = g.nx === 1 ? 0.5 : x / (g.nx - 1);
        const ty = g.ny === 1 ? 0.5 : y / (g.ny - 1);
        const angle = rand() * Math.PI * 2;
        const mag = s.jitter * (rand() - 0.5);
        this.homeX[i] = (tx - 0.5) * s.w + s.x + Math.cos(angle) * mag;
        this.homeY[i] = (ty - 0.5) * s.h + s.y + Math.sin(angle) * mag;
        i++;
      }
    }
  }

  reset() {
    for (let i = 0; i < this.n; i++) {
      this.px[i] = this.homeX[i];
      this.py[i] = this.homeY[i];
      this.vx[i] = 0;
      this.vy[i] = 0;
      this.predX[i] = this.px[i];
      this.predY[i] = this.py[i];
      this.dens[i] = this.selfD;
      this.near[i] = this.selfN;
    }
    this.paused = false;
    this.stepOnce = false;
    this.syncHud();
  }

  togglePause() {
    this.paused = !this.paused;
    this.syncHud();
  }

  cellIndex(x, y) {
    const ix = Math.floor(x / this.h);
    const iy = Math.floor(y / this.h);
    const gx = ix + this.ox, gy = iy + this.oy;
    if (gx < 0 || gy < 0 || gx >= this.gw || gy >= this.gh) return -1;
    return gx + gy * this.gw;
  }

  buildGrid() {
    this.heads.fill(-1);
    for (let i = 0; i < this.n; i++) {
      const c = this.cellIndex(this.predX[i], this.predY[i]);
      if (c < 0) { this.next[i] = -1; continue; }
      this.next[i] = this.heads[c];
      this.heads[c] = i;
    }
  }

  forNeighbors(i, fn) {
    const c = this.cellIndex(this.predX[i], this.predY[i]);
    if (c < 0) return;
    const gx = c % this.gw, gy = (c / this.gw) | 0;
    for (let oy = -1; oy <= 1; oy++) {
      const yy = gy + oy;
      if (yy < 0 || yy >= this.gh) continue;
      for (let ox = -1; ox <= 1; ox++) {
        const xx = gx + ox;
        if (xx < 0 || xx >= this.gw) continue;
        let j = this.heads[xx + yy * this.gw];
        while (j !== -1) {
          fn(j);
          j = this.next[j];
        }
      }
    }
  }

  kernel2(dst) {
    if (dst >= this.h) return 0;
    const v = this.h - dst;
    return v * v * this.spiky2;
  }
  kernel3(dst) {
    if (dst >= this.h) return 0;
    const v = this.h - dst;
    return v * v * v * this.spiky3;
  }
  deriv2(dst) {
    if (dst > this.h) return 0;
    return -(this.h - dst) * this.dSpiky2;
  }
  deriv3(dst) {
    if (dst > this.h) return 0;
    const v = this.h - dst;
    return -v * v * this.dSpiky3;
  }
  kernelPoly6(dst) {
    if (dst >= this.h) return 0;
    const v = this.h2 - dst * dst;
    return v * v * v * this.poly6;
  }

  external(i) {
    let ax = 0, ay = this.gravity;
    const strength = this.mouse.push ? -this.interactStrength : (this.mouse.pull ? this.interactStrength : 0);
    if (strength !== 0) {
      const ox = this.mouse.x - this.px[i];
      const oy = this.mouse.y - this.py[i];
      const sqr = ox * ox + oy * oy;
      const r2 = this.interactRadius * this.interactRadius;
      if (sqr < r2 && sqr > 1e-8) {
        const dst = Math.sqrt(sqr);
        const centreT = 1 - dst / this.interactRadius;
        const gravityWeight = 1 - centreT * Math.min(1, Math.max(0, strength / 10));
        ax = (ox / dst) * centreT * strength - this.vx[i] * centreT;
        ay = this.gravity * gravityWeight + (oy / dst) * centreT * strength - this.vy[i] * centreT;
      }
    }
    this.vx[i] += ax * this.dt;
    this.vy[i] += ay * this.dt;
  }

  densityPass() {
    for (let i = 0; i < this.n; i++) {
      let d = 0, n = 0;
      const x = this.predX[i], y = this.predY[i];
      this.forNeighbors(i, j => {
        const dx = this.predX[j] - x, dy = this.predY[j] - y;
        const d2 = dx * dx + dy * dy;
        if (d2 > this.h2) return;
        const dst = Math.sqrt(d2);
        d += this.kernel2(dst);
        n += this.kernel3(dst);
      });
      this.dens[i] = d > 0 ? d : this.selfD;
      this.near[i] = n > 0 ? n : this.selfN;
    }
  }

  pressurePass() {
    for (let i = 0; i < this.n; i++) {
      const pressure = (this.dens[i] - this.targetDensity) * this.pressureMul;
      const nearP = this.nearPressureMul * this.near[i];
      let fx = 0, fy = 0;
      const x = this.predX[i], y = this.predY[i];
      this.forNeighbors(i, j => {
        if (j === i) return;
        const dx = this.predX[j] - x, dy = this.predY[j] - y;
        const d2 = dx * dx + dy * dy;
        if (d2 > this.h2) return;
        const dst = Math.sqrt(d2);
        const dirx = dst > 0 ? dx / dst : 0;
        const diry = dst > 0 ? dy / dst : 1;
        const nd = this.dens[j] > 1e-4 ? this.dens[j] : 1e-4;
        const nn = this.near[j] > 1e-4 ? this.near[j] : 1e-4;
        const shared = (pressure + (nd - this.targetDensity) * this.pressureMul) * 0.5;
        const sharedNear = (nearP + this.nearPressureMul * nn) * 0.5;
        const s = this.deriv2(dst) * shared / nd + this.deriv3(dst) * sharedNear / nn;
        fx += dirx * s;
        fy += diry * s;
      });
      const invD = this.dens[i] > 1e-4 ? 1 / this.dens[i] : 0;
      this.vx[i] += fx * invD * this.dt;
      this.vy[i] += fy * invD * this.dt;
    }
  }

  viscosityPass() {
    for (let i = 0; i < this.n; i++) {
      let fx = 0, fy = 0;
      const x = this.predX[i], y = this.predY[i];
      const vxi = this.vx[i], vyi = this.vy[i];
      this.forNeighbors(i, j => {
        if (j === i) return;
        const dx = this.predX[j] - x, dy = this.predY[j] - y;
        const d2 = dx * dx + dy * dy;
        if (d2 > this.h2) return;
        const w = this.kernelPoly6(Math.sqrt(d2));
        fx += (this.vx[j] - vxi) * w;
        fy += (this.vy[j] - vyi) * w;
      });
      this.vx[i] += fx * this.viscosity * this.dt;
      this.vy[i] += fy * this.viscosity * this.dt;
    }
  }

  collide(i) {
    const ax = Math.abs(this.px[i]), ay = Math.abs(this.py[i]);
    if (this.halfX - ax <= 0) {
      this.px[i] = this.halfX * Math.sign(this.px[i]);
      this.vx[i] *= -this.damping;
    }
    if (this.halfY - ay <= 0) {
      this.py[i] = this.halfY * Math.sign(this.py[i]);
      this.vy[i] *= -this.damping;
    }
    if (this.obsHx > 0 && this.obsHy > 0) {
      const dx = this.px[i] - this.obstacleCentre.x, dy = this.py[i] - this.obstacleCentre.y;
      const ex = this.obsHx - Math.abs(dx), ey = this.obsHy - Math.abs(dy);
      if (ex >= 0 && ey >= 0) {
        if (ex < ey) {
          this.px[i] = this.obsHx * Math.sign(dx) + this.obstacleCentre.x;
          this.vx[i] *= -this.damping;
        } else {
          this.py[i] = this.obsHy * Math.sign(dy) + this.obstacleCentre.y;
          this.vy[i] *= -this.damping;
        }
      }
    }
  }

  substep() {
    for (let i = 0; i < this.n; i++) {
      this.external(i);
      this.predX[i] = this.px[i] + this.vx[i] * this.predict;
      this.predY[i] = this.py[i] + this.vy[i] * this.predict;
    }
    this.buildGrid();
    this.densityPass();
    this.pressurePass();
    this.viscosityPass();
    for (let i = 0; i < this.n; i++) {
      this.px[i] += this.vx[i] * this.dt;
      this.py[i] += this.vy[i] * this.dt;
      this.collide(i);
    }
  }

  step(frameDt) {
    this.dt = frameDt / this.iterations;
    for (let s = 0; s < this.iterations; s++) this.substep();
  }

  worldToScreen(x, y) {
    return [this.viewW * 0.5 + x * this.scale, this.viewH * 0.5 - y * this.scale];
  }

  screenToWorld(sx, sy) {
    return { x: (sx - this.viewW * 0.5) / this.scale, y: (this.viewH * 0.5 - sy) / this.scale };
  }

  draw() {
    const g = this.g;
    g.fillStyle = '#07090d';
    g.fillRect(0, 0, this.viewW, this.viewH);
    const x0 = this.worldToScreen(-this.halfX, this.halfY);
    const x1 = this.worldToScreen(this.halfX, -this.halfY);
    g.strokeStyle = '#3d4a5c';
    g.lineWidth = 2;
    g.strokeRect(x0[0], x0[1], x1[0] - x0[0], x1[1] - x0[1]);

    const rad = this.particleScale * 0.5 * this.scale;
    const buckets = GRAD.map(() => []);
    for (let i = 0; i < this.n; i++) {
      const s = Math.sqrt(this.vx[i] * this.vx[i] + this.vy[i] * this.vy[i]) / this.velMax;
      let b = (s * 31) | 0;
      if (b < 0) b = 0;
      if (b > 31) b = 31;
      const p = this.worldToScreen(this.px[i], this.py[i]);
      buckets[b].push(p[0], p[1]);
    }
    for (let b = 0; b < buckets.length; b++) {
      const pts = buckets[b];
      if (!pts.length) continue;
      g.fillStyle = GRAD[b];
      g.beginPath();
      for (let k = 0; k < pts.length; k += 2) {
        g.moveTo(pts[k] + rad, pts[k + 1]);
        g.arc(pts[k], pts[k + 1], rad, 0, 6.283185307179586);
      }
      g.fill();
    }

    if (this.mouse.pull || this.mouse.push) {
      const p = this.worldToScreen(this.mouse.x, this.mouse.y);
      g.beginPath();
      g.arc(p[0], p[1], this.interactRadius * this.scale, 0, 6.283185307179586);
      g.strokeStyle = this.mouse.push ? 'rgba(255,90,70,0.8)' : 'rgba(90,220,140,0.8)';
      g.lineWidth = 1.5;
      g.stroke();
    }
  }

  canvasPos(e) {
    const r = this.canvas.getBoundingClientRect();
    return this.screenToWorld((e.clientX - r.left) * (this.viewW / r.width), (e.clientY - r.top) * (this.viewH / r.height));
  }

  bindPointer() {
    const cv = this.canvas;
    cv.addEventListener('pointerdown', e => {
      const p = this.canvasPos(e);
      this.mouse.x = p.x; this.mouse.y = p.y;
      if (e.button === 0) this.mouse.pull = true;
      if (e.button === 2) this.mouse.push = true;
      cv.setPointerCapture(e.pointerId);
      hoverSim = this;
    });
    cv.addEventListener('pointermove', e => {
      const p = this.canvasPos(e);
      this.mouse.x = p.x; this.mouse.y = p.y;
    });
    cv.addEventListener('pointerup', e => {
      if (e.button === 0) this.mouse.pull = false;
      if (e.button === 2) this.mouse.push = false;
    });
    cv.addEventListener('pointerenter', () => { hoverSim = this; });
    cv.addEventListener('pointerleave', () => { this.mouse.pull = false; this.mouse.push = false; });
    cv.addEventListener('contextmenu', e => e.preventDefault());
  }

  syncHud() {
    if (!this.hud) return;
    this.hud.n.textContent = this.n;
    this.hud.st.textContent = this.paused ? 'paused' : 'running';
    this.hud.ms.textContent = this.stepMs.toFixed(1);
    this.hud.pause.textContent = this.paused ? 'Play' : 'Pause';
  }

  frame(now) {
    const elapsed = Math.min((now - this.last) / 1000, this.maxDt);
    this.last = now;
    if (!this.paused || this.stepOnce) {
      const t0 = performance.now();
      this.step(this.stepOnce ? this.maxDt : elapsed);
      this.stepMs = performance.now() - t0;
      if (this.stepOnce) {
        this.paused = true;
        this.stepOnce = false;
      }
    }
    this.syncHud();
    this.draw();
  }
}

function mountFluid(parent, options) {
  const view = document.createElement('section');
  view.className = 'view';
  const info = document.createElement('div');
  info.className = 'info';
  info.innerHTML = 'Particles <strong></strong> <span>State <strong></strong></span> <span>Step <strong></strong> ms</span>';
  const canvas = document.createElement('canvas');
  const btns = document.createElement('div');
  btns.className = 'btns';
  const pause = document.createElement('button');
  pause.textContent = 'Pause';
  const reset = document.createElement('button');
  reset.textContent = 'Reset';
  btns.append(pause, reset);
  if (options && options.title) {
    const title = document.createElement('h2');
    title.textContent = options.title;
    view.append(title);
  }
  view.append(info, canvas, btns);
  parent.appendChild(view);

  const sim = new FluidSim(canvas, options);
  const strong = info.querySelectorAll('strong');
  sim.hud = { n: strong[0], st: strong[1], ms: strong[2], pause };
  pause.addEventListener('click', () => sim.togglePause());
  reset.addEventListener('click', () => sim.reset());
  sim.syncHud();
  return sim;
}

const views = document.getElementById('views');
const sims = [
  mountFluid(views)
];
let hoverSim = sims[0];

window.FluidSim = FluidSim;
window.sims = sims;

window.addEventListener('keydown', e => {
  const sim = hoverSim;
  if (!sim) return;
  if (e.code === 'Space') { e.preventDefault(); sim.togglePause(); }
  else if (e.code === 'KeyR') sim.reset();
  else if (e.code === 'ArrowRight') { sim.stepOnce = true; sim.paused = false; }
});

function frame(now) {
  for (let i = 0; i < sims.length; i++) sims[i].frame(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
